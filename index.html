<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTS Final Exam Reviewer & Simulator</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mute:#5a6785;--line:#dde3ef;--pri:#3b55d9;--pri-ink:#fff;--pri-soft:#e8ecff;--ok:#0f7a55;--ok-soft:#dcf5ea;--bad:#c0354a;--bad-ink:#fff;--bad-soft:#fde5e9;--warn:#9a5d06;--warn-soft:#fff1d6;--shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.06);color-scheme:light}
[data-theme=dark]{--bg:#0e1525;--card:#17213a;--ink:#e8edf8;--mute:#9aa8c6;--line:#2a3756;--pri:#8ba2ff;--pri-ink:#0e1525;--pri-soft:#232f57;--ok:#4ed3a2;--ok-soft:#12372b;--bad:#ff8394;--bad-ink:#2a0d12;--bad-soft:#41202a;--warn:#f1b24a;--warn-soft:#3b2f12;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 12px}
h3{margin:0 0 8px}
p{margin:0 0 12px}
.lead{color:var(--mute);margin-bottom:22px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
.side{width:250px;position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--card)}
.brand{display:flex;gap:10px;align-items:center}
.brand small{display:block;color:var(--mute);font-size:.8rem}
.logo{width:40px;height:40px;border-radius:12px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;font-size:.85rem}
#nav{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;color:var(--mute);border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.nv:hover{background:var(--pri-soft);color:var(--ink)}
.nv.on{background:var(--pri-soft);color:var(--pri)}
.badge{margin-left:auto;background:#c0354a;color:#fff;font-style:normal;font-size:12px;border-radius:999px;padding:0 7px;line-height:20px}
.side-foot{margin-top:auto;display:grid;gap:6px}
.ghost-btn{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;background:none;border-radius:12px;color:var(--mute);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.ghost-btn:hover{background:var(--pri-soft);color:var(--ink)}
.main-wrap{flex:1;min-width:0}
main{max-width:920px;margin:0 auto;padding:30px 26px 100px;outline:none}
.top,.tabbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;line-height:1.2}
.tile span{color:var(--mute);font-size:.88rem}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .1s,border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--pri)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.danger{background:var(--bad);color:var(--bad-ink);border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row.sp{justify-content:space-between}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid var(--line);color:var(--mute);background:var(--bg)}
.chip.sub{color:#fff;border-color:transparent;background:var(--c)}
.chip.d-easy{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.d-medium{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.d-hard{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.un{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .35s}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:.9rem;margin:8px 0 18px}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.5;margin:0 0 18px;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri-soft)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:var(--pri-soft);color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .ltr{background:var(--pri);color:var(--pri-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);color:var(--bad-ink)}
.opt:disabled{cursor:default;color:var(--ink)}
.txt,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.txt:focus,select:focus{border-color:var(--pri);outline:none}
.idbox{display:flex;gap:10px;flex-wrap:wrap}
.idbox .txt{flex:1;min-width:200px}
.recall{text-align:center;padding:26px 10px;color:var(--mute);border:2px dashed var(--line);border-radius:14px}
.recall .btn{margin-top:12px}
.fb{margin-top:18px;padding:16px 18px;border-radius:14px;border-left:6px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb p{margin:8px 0 0}
.note{margin-top:10px;font-size:.92rem;color:var(--mute)}
.form{display:grid;gap:16px}
.form label{display:grid;gap:6px;font-weight:600}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.chk{display:flex!important;grid-template-columns:none!important;align-items:center;gap:10px;font-weight:500!important}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
.subj-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.subj-row .nm{width:150px;flex:none;font-weight:600;font-size:.92rem}
.subj-row .bar{flex:1}
.subj-row .vl{width:150px;flex:none;text-align:right;font-size:.85rem;color:var(--mute)}
.subj-row .bar i{background:var(--c)}
.hero-score{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.rec{padding:12px 14px;border-radius:12px;background:var(--pri-soft);margin-bottom:10px}
.rec.warn{background:var(--warn-soft)}
.rec.good{background:var(--ok-soft)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.pb{padding:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pb.done{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.pb.cur{outline:3px solid var(--pri);outline-offset:1px}
.xhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
.clock.low{background:var(--bad-soft);color:var(--bad)}
.rv{border-left:6px solid var(--line);padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left-width:6px;margin-bottom:12px}
.rv.c{border-left-color:var(--ok)}.rv.w{border-left-color:var(--bad)}.rv.u{border-left-color:var(--warn)}
.rv .qq{font-weight:600;margin:8px 0;white-space:pre-line}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0}
.kv span{color:var(--mute);min-width:120px}
.expl{margin:10px 0 6px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.95rem}
.fcard{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:28px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);cursor:pointer;white-space:pre-line}
.fcard.back{border-color:var(--pri);background:var(--pri-soft)}
.fcard.anim{animation:flip .35s ease}
.fc-tag{font-size:.78rem;font-weight:700;color:var(--mute)}
.fc-main{font-size:1.3rem;font-weight:600}
.fc-note{font-size:.95rem;color:var(--mute);max-width:560px}
@keyframes flip{from{transform:rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
details.mi{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
details.mi summary{padding:14px 16px;cursor:pointer;font-weight:600;list-style:none}
details.mi .in{padding:0 16px 16px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:20px;z-index:50}
.dlg{background:var(--card);border-radius:18px;padding:24px;max-width:440px;width:100%;box-shadow:var(--shadow)}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
pre{background:var(--bg);padding:12px;border-radius:12px;overflow-x:auto}
.warnbox{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);margin-bottom:16px}
@media(max-width:899px){
 .side{display:none}
 .top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
 .top .ghost-btn{padding:8px}
 .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
 .tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:var(--mute);font:inherit;font-size:.68rem;font-weight:600;cursor:pointer}
 .tb.on{color:var(--pri)}
 .tb .badge{position:absolute;top:2px;right:8px;margin:0;line-height:16px;font-size:10px;padding:0 5px}
 main{padding:18px 14px 100px}
 h1{font-size:1.55rem}
 .subj-row{flex-wrap:wrap}.subj-row .nm,.subj-row .vl{width:auto;flex:1 1 40%}.subj-row .bar{flex:1 1 100%;order:3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand"><div class="logo">UTS</div><div><b>Final Exam Reviewer</b><small>Understanding the Self</small></div></div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="side-foot">
   <button class="ghost-btn" data-act="theme" id="themeBtn"></button>
   <button class="ghost-btn" data-act="reset"><svg class="i" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>Reset progress</button>
  </div>
 </aside>
 <div class="main-wrap">
  <header class="top"><div class="brand"><div class="logo">UTS</div><b>Exam Reviewer</b></div>
   <div><button class="ghost-btn" data-act="theme" id="themeBtn2" aria-label="Toggle theme"></button><button class="ghost-btn" data-act="reset" aria-label="Reset progress"><svg class="i" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button></div></header>
  <main id="view" tabindex="-1"></main>
 </div>
 <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   1. SUBJECTS & TOPICS
   ===================================================================== */
const SUBJECTS={
 physical:{name:'The Biological & Physical Self',short:'Physical Self',color:'#2f7fd8'},
 sexual:{name:'The Sexual Self',short:'Sexual Self',color:'#c93a77'},
 material:{name:'The Material Self & Consumer Psychology',short:'Material Self',color:'#b57508'},
 spiritual:{name:'The Spiritual Self & Logotherapy',short:'Spiritual Self',color:'#7551d1'},
 political:{name:'The Political Self & Leadership',short:'Political Self',color:'#168a68'},
 digital:{name:'The Digital Self',short:'Digital Self',color:'#0b86a0'}
};
const T={
 her:'Heredity, Environment & Chromosomes',endo:'Endocrine System & Hormones',sexc:'Primary vs. Secondary Sex Characteristics',per:'The 4 Self-Perceptions',aud:'Imaginary Audience & Self-Care',
 hist:'Historical Perspectives on Sexuality',evo:'Evolutionary Perspective',tri:'Sex, Gender & Sexual Orientation',src:'Sexual Response Cycle',love:'Theories of Love & Attraction',stis:'STIs & Reproductive Health',
 jam:'William James & the Material Self',con:'Constituents of the Material Self',mat:'Materialism & Consumerism',pers:'Persuasion Techniques & Maslow',
 spi:'Spiritual Self, Beliefs & Practices',ind:'Indigenous Spirituality',rit:'Rituals',ebr:'Ebralinag Case',logo:'Logotherapy (Viktor Frankl)',
 pol:'Political Self & Citizenship',soc:'Socialization & Social Influence',lead:'Leadership Theories',fil:'Filipino Values in Politics',
 dig:'Digital Self & Zhao’s Characteristics',imp:'Impression Management (Goffman)',dis:'Online Disinhibition Effect',haz:'Psychological Hazards Online'
};
const TYPE_LABEL={mcq:'Multiple choice',tf:'True / False',id:'Identification',sit:'Situational'};

/* =====================================================================
   2. QUESTION BANK  (edit or add questions here)
   ---------------------------------------------------------------------
   mc / sit : mc(subject, topic, difficulty, question, CORRECT, [3 wrong], explanation)
              The correct answer is written FIRST; the app shuffles choices every time.
   tf       : tf(subject, topic, difficulty, statement, true|false, explanation)
   idq      : idq(subject, topic, difficulty, clue, answer, [alternate answers], explanation)
   TIP: add new questions at the END of the list so saved progress stays matched.
   ===================================================================== */
const QUESTIONS=[];
const mc=(s,t,d,q,c,w,e)=>QUESTIONS.push({subject:s,topic:t,type:'mcq',difficulty:d,question:q,options:[c,...w],answer:0,explanation:e});
const sit=(s,t,d,q,c,w,e)=>QUESTIONS.push({subject:s,topic:t,type:'sit',difficulty:d,question:q,options:[c,...w],answer:0,explanation:e});
const tf=(s,t,d,q,a,e)=>QUESTIONS.push({subject:s,topic:t,type:'tf',difficulty:d,question:q,answer:a,explanation:e});
const idq=(s,t,d,q,a,alt,e)=>QUESTIONS.push({subject:s,topic:t,type:'id',difficulty:d,question:q,answer:a,alt:alt||[],explanation:e});

/* ---------- PHYSICAL SELF ---------- */
mc('physical',T.her,'easy',"What shapes a person’s physical self, according to the reviewer?","Both heredity and environment",["Genes alone","The environment alone","The pineal gland only"],"★ Exam Focus: The physical self is influenced by both heredity and environment, not shaped by genes alone.");
idq('physical',T.her,'easy',"Biological traits and genetic characteristics transmitted from parents to children.","Heredity",[],"Heredity is the passing of biological traits and genetic characteristics from parents to children.");
idq('physical',T.her,'easy',"All external conditions affecting the physical, mental, and social development of a person.","Environment",[],"Environment covers all outside conditions that affect a person’s physical, mental, and social development.");
tf('physical',T.her,'easy',"The physical self is shaped by genes alone.",false,"False. ★ Exam Focus: Both heredity and environment influence the physical self.");
tf('physical',T.her,'medium',"In the 23rd pair of chromosomes, XX is female and XY is male.",true,"True. The 23rd pair (the sex chromosomes) determines biological sex: XX = female, XY = male.");
mc('physical',T.endo,'easy',"Which gland is called the “master gland” because it regulates other endocrine glands and orchestrates puberty?","Pituitary gland",["Hypothalamus","Pineal gland","Thyroid gland"],"The pituitary gland is the master gland. The hypothalamus secretes the hormones that control the pituitary.");
mc('physical',T.endo,'medium',"Which gland releases melatonin, which regulates the sleep-wake cycle and circadian rhythms?","Pineal gland",["Thymus","Thyroid gland","Parathyroid gland"],"The pineal gland releases melatonin, which regulates the sleep-wake cycle and circadian rhythms.");
mc('physical',T.endo,'medium',"Which gland regulates the level of calcium in the bloodstream?","Parathyroid gland",["Thyroid gland","Thymus","Pituitary gland"],"The parathyroid gland regulates calcium levels in the blood. (The thyroid controls metabolism and growth.)");
mc('physical',T.endo,'medium',"Which gland produces hormones that control metabolism and growth?","Thyroid gland",["Parathyroid gland","Pineal gland","Thymus"],"The thyroid gland produces hormones controlling metabolism and growth.");
mc('physical',T.endo,'medium',"Which hormone is primarily responsible for developing male secondary sex characteristics such as a deeper voice and facial hair?","Testosterone",["Estrogen","Prolactin","Oxytocin"],"★ Exam Focus: Testosterone is the primary hormone for male secondary sex characteristics (deeper voice, facial hair) during puberty.");
tf('physical',T.endo,'medium',"Estrogen is the primary hormone that causes a deeper voice and facial hair during puberty.",false,"False. That is testosterone. Estrogen triggers female secondary sex characteristics such as breast enlargement and menstruation.");
mc('physical',T.endo,'hard',"Which hormone–function pair is correct?","Prolactin – facilitates milk production after birth",["Prolactin – promotes uterine contractions","Oxytocin – regulates the sleep-wake cycle","Oxytocin – controls calcium in the blood"],"Prolactin facilitates milk production after birth. Oxytocin promotes uterine contractions and maternal bonding.");
idq('physical',T.endo,'medium',"The hormone that promotes uterine contractions and maternal bonding.","Oxytocin",[],"Oxytocin promotes uterine contractions and maternal bonding. Prolactin is the one for milk production.");
idq('physical',T.sexc,'easy',"Physical anatomical traits present at birth and directly involved in reproduction (e.g., penis, testes, ovaries, uterus).","Primary sex characteristics",["primary sex characteristic","primary sex traits"],"★ Exam Focus: Primary sex characteristics are present at birth and directly involved in reproduction.");
tf('physical',T.sexc,'medium',"Secondary sex characteristics are present at birth and directly involved in reproduction.",false,"False. That describes primary sex characteristics. Secondary ones (voice deepening, body hair, breast development) develop at puberty and are not directly involved in reproduction.");
sit('physical',T.sexc,'medium',"At age 13, Marco notices that his voice is getting deeper and facial hair is starting to grow. These changes are examples of:","Secondary sex characteristics",["Primary sex characteristics","Self-concept","The imaginary audience"],"Voice deepening and facial hair appear at puberty and are not directly involved in reproduction, so they are secondary sex characteristics.");
sit('physical',T.per,'easy',"Ana looks in the mirror and thinks, “I am an attractive and desirable person.” This is her:","Self-image",["Self-concept","Self-identity","Self-esteem"],"★ Exam Focus: Self-image is the subjective mental picture of one’s physical appearance.");
sit('physical',T.per,'medium',"A student introduces herself: “I am a psychology student and I live in Quezon City.” These statements are examples of:","Self-identity",["Self-image","Self-concept","Self-esteem"],"★ Exam Focus: Self-identity refers to social, categorical, or geographic identifiers such as “I am living in Quezon City” or “I am a psychology student.”");
sit('physical',T.per,'medium',"Jose describes himself: “I’m friendly and smart, but I get irritated at times.” This is his:","Self-concept",["Self-image","Self-identity","Self-esteem"],"★ Exam Focus: Self-concept is the overall cognitive construction and beliefs held about one’s nature and traits.");
idq('physical',T.per,'medium',"The evaluative assessment of one’s personal self-worth.","Self-esteem",[],"Self-esteem is the evaluation of personal self-worth. Negative body image from strict beauty standards lowers it.");
mc('physical',T.per,'hard',"Which statement correctly distinguishes self-image from self-concept?","Self-image is the mental picture of one’s physical appearance; self-concept is the overall belief about one’s nature and traits.",["Self-image is the overall belief about one’s traits; self-concept is the mental picture of one’s appearance.","Self-image is a social or geographic label; self-concept is a feeling of self-worth.","Self-image is the evaluation of self-worth; self-concept is a social category."],"Self-image = picture of appearance. Self-concept = beliefs about nature and traits. Self-identity = social/geographic labels. Self-esteem = evaluation of self-worth.");
sit('physical',T.aud,'medium',"Before reporting in class, Lia is convinced that everyone is staring at her and judging her, even though no one is paying attention. This is an example of:","The imaginary audience",["Self-esteem","Self-identity","Toxic disinhibition"],"The imaginary audience is the egocentric adolescent belief that one is constantly watched and evaluated by others.");
mc('physical',T.aud,'easy',"Why is exercise considered an essential self-care practice?","It improves concentration and promotes better mood",["It permanently changes a person’s chromosomes","It replaces the need for a balanced diet","It removes the influence of heredity"],"★ Exam Focus: Exercise is essential self-care because it improves concentration and promotes better mood.");

/* ---------- SEXUAL SELF ---------- */
mc('sexual',T.hist,'medium',"Which era revered the male as the dominant symbol of fertility and viewed women as subordinate property with no legal rights?","Ancient Greece",["The Victorian Era","The Puritan Era","The Protestant Reformation"],"In Ancient Greece the male was the dominant symbol of fertility, and women were seen as subordinate property without legal rights.");
idq('sexual',T.hist,'medium',"The era in which Catholic hegemony decreed all non-procreative sexual acts evil and labeled women as either Temptress (Eve) or Virgin (Mary).","Middle Ages",["The Middle Ages","Medieval period","Medieval times","Medieval era"],"In the Middle Ages women were forced into a rigid dichotomy: Temptress (Eve) or Virgin / Woman of Virtue (Mary).");

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weightedOrder(list,wf){return list.map(x=>({x,k:Math.pow(Math.random(),1/Math.max(wf(x),0.05))})).sort((a,b)=>b.k-a.k).map(o=>o.x);}
function norm(s){return String(s==null?'':s).toLowerCase().trim().replace(/^(the|a|an)\s+/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
function checkId(q,input){const n=norm(input);if(!n)return false;return [q.answer].concat(q.alt||[]).some(a=>norm(a)===n);}
function isCorrect(q,ans){if(q.type==='id')return checkId(q,ans);return ans===q.answer;}
const isBlank=it=>it.ans===null||it.ans===undefined||(typeof it.ans==='string'&&!it.ans.trim());
function correctText(q,short){
 if(q.type==='tf')return q.answer?'True':'False';
 if(q.type==='id')return q.answer+(!short&&q.alt&&q.alt.length?' (also accepted: '+q.alt.join(', ')+')':'');
 return q.options[q.answer];
}
function ansText(q,ans){
 if(q.type==='tf')return ans===true?'True':ans===false?'False':'— no answer —';
 if(q.type==='id')return String(ans||'').trim()||'— no answer —';
 return ans===null||ans===undefined?'— no answer —':q.options[ans];
}

function record(q,ok){
 const st=store.q[q.id]||(store.q[q.id]={r:0,w:0,streak:0,last:0});
 let cleared=false;const m=store.mistakes[q.id];
 if(ok){st.r++;st.streak++;if(m){m.ok=(m.ok||0)+1;if(m.ok>=2){delete store.mistakes[q.id];store.cleared=(store.cleared||0)+1;cleared=true;}}}
 else{st.w++;st.streak=0;store.mistakes[q.id]={ok:0,added:m?m.added:Date.now(),times:(m?m.times||1:0)+1};}
 st.last=Date.now();save();return {cleared};
}

function restore(id,snap){const s=JSON.parse(snap);if(s.q)store.q[id]=s.q;else delete store.q[id];if(s.m)store.mistakes[id]=s.m;else delete store.mistakes[id];store.cleared=s.c;save();}
const qWeight=q=>{const st=store.q[q.id];let w=1;if(store.mistakes[q.id])w+=3;if(st){w+=Math.min(st.w,4)*0.4;if(st.streak>=3&&!store.mistakes[q.id])w*=0.5;}else w+=0.3;return w;};

/* validation of the bank (shown in Source Notes) */
function validate(){
 const issues=[],seen=new Set();
 QUESTIONS.forEach(q=>{
  const k=q.question.trim().toLowerCase();if(seen.has(k))issues.push('Duplicate question: '+q.id);seen.add(k);
  if(!q.question||!q.explanation)issues.push('Empty text: '+q.id);
  if(!SUBJECTS[q.subject])issues.push('Unknown subject: '+q.id);
  if(q.type==='mcq'||q.type==='sit'){if(!q.options||q.options.length!==4||new Set(q.options.map(norm)).size!==4||!(q.answer>=0&&q.answer<4))issues.push('Bad options: '+q.id);}
  else if(q.type==='tf'){if(typeof q.answer!=='boolean')issues.push('Bad true/false key: '+q.id);}
  else if(q.type==='id'){if(!q.answer)issues.push('Missing answer: '+q.id);}
  else issues.push('Unknown type: '+q.id);
 });
 return issues;
}

function recommendHTML(ss){
 if(!ss.some(s=>s.att>0))return '<div class="rec">You haven’t answered anything yet. Start with <b>Study mode</b> on one subject, then try a mock exam.</div>';
 const att=ss.filter(s=>s.att>=5).sort((a,b)=>a.acc-b.acc);
 let out='';
 if(att.length){
  const w=att[0];
  if(w.acc<0.8)out+='<div class="rec warn">Your weakest subject so far is <b>'+SUBJECTS[w.k].name+'</b> ('+Math.round(w.acc*100)+'% accuracy). Review it in Study mode next.</div>';
  else out+='<div class="rec good">All subjects you practiced are at 80% or higher. Take a full mock exam to test your recall under pressure.</div>';
 }else out+='<div class="rec">Answer at least 5 questions in a subject to get a subject-based recommendation.</div>';
 const hot=hotTopics();
 if(hot.length)out+='<div class="rec warn">Topics with the most unresolved mistakes: '+hot.map(h=>'<b>'+esc(h[0])+'</b> ('+h[1]+')').join(', ')+'.</div>';
 const untouched=ss.filter(s=>s.att===0).map(s=>SUBJECTS[s.k].short);
 if(untouched.length)out+='<div class="rec">Not started yet: '+untouched.join(', ')+'.</div>';
 return out;
}

function startStudy(list,src){ui={stage:'q',src,list,i:0,correct:0,wrongs:[],cleared:0};prepQ();render();window.scrollTo(0,0);}
function prepQ(){const q=ui.list[ui.i];ui.ord=q.options?shuffle(q.options.map((_,i)=>i)):[];ui.sel=null;ui.answered=false;ui.revealed=false;ui.last=null;}
function studyQ(){
 const q=ui.list[ui.i],n=ui.list.length,locked=ui.answered;
 const hidden=!locked&&store.recall&&q.type!=='id'&&!ui.revealed;
 let h='<div class="row sp" style="margin:0 0 8px"><b>'+(ui.src==='mistakes'?'Practicing my mistakes':'Study mode')+'</b><button class="btn sm" data-act="quitstudy">End session</button></div>';
 h+=bar((ui.i+(locked?1:0))/n*100)+'<div class="meta"><span>Question '+(ui.i+1)+' of '+n+'</span><span>Score: '+ui.correct+' / '+(ui.i+(locked?1:0))+'</span></div>';
 h+='<div class="card">'+tagsHTML(q,true)+'<p class="qtext">'+esc(q.question)+'</p>';
 h+=hidden?'<div class="recall">Try to recall the answer first…<br><button class="btn pri" data-act="reveal">Show choices</button></div>':inputHTML(q,{ord:ui.ord,sel:ui.sel,locked,mode:'study'});
 if(locked){
  const L=ui.last;

function studyAnswer(v){

function finishExam(auto){

 A.items.forEach(it=>{
  const q=QMAP[it.id],sb=subj[q.subject]||(subj[q.subject]={c:0,t:0});sb.t++;

   ===================================================================== */
const cardW=cd=>({need:4,know:0.4}[store.cards[cd.id]]||2);
function cardStats(){let k=0,n=0;Object.keys(store.cards).forEach(id=>{if(CMAP[id]||QMAP[id]){if(store.cards[id]==='know')k++;else if(store.cards[id]==='need')n++;}});return {k,n};}
function vCards(){
 if(ui.stage==='deck')return deckHTML();
 if(ui.stage==='end')return deckEnd();
 const st=cardStats(),opts=Object.keys(SUBJECTS).map(k=>'<option value="'+k+'">'+esc(SUBJECTS[k].name)+'</option>').join('');
 return '<h1>Flashcards</h1><p class="lead">Read the clue, try to say the answer out loud, then flip. '+CARDS.length+' cards available · '+st.k+' marked “I know this” · '+st.n+' marked “Need more practice.”</p><div class="card form">'+
 '<label>Subject<select id="c-subj"><option value="all">All subjects</option>'+opts+'</select></label>'+
 '<label class="chk"><input type="checkbox" id="c-pri" checked> Show cards I need to practice more often</label>'+
 '<label class="chk"><input type="checkbox" id="c-need"> Only cards marked “Need more practice”</label>'+
 '<label class="chk"><input type="checkbox" id="c-mist"> Add my missed quiz questions as cards ('+mistakeIds().length+')</label>'+
 '<div class="row" style="margin:0"><button class="btn pri" data-act="startcards">Start flashcards</button></div></div>';
}
function buildDeck(){
 const subj=$('#c-subj').value,need=$('#c-need').checked,inc=$('#c-mist').checked,pri=$('#c-pri').checked;
 let list=CARDS.filter(cd=>subj==='all'||cd.subject===subj);
 if(inc)mistakeIds().map(id=>QMAP[id]).filter(q=>subj==='all'||q.subject===subj).forEach(q=>list.push(qToCard(q)));
 if(need)list=list.filter(cd=>store.cards[cd.id]==='need');
 return {list,pri};
}
function orderDeck(list,pri){return pri?weightedOrder(list,cardW):shuffle(list);}
function deckHTML(){
 const cd=ui.cards[ui.i],n=ui.cards.length,s=store.cards[cd.id];
 return '<div class="row sp" style="margin:0 0 8px"><b>Flashcards</b><button class="btn sm" data-act="nav" data-v="cards">Change filters</button></div>'+bar((ui.i+1)/n*100)+
 '<div class="meta"><span>Card '+(ui.i+1)+' of '+n+'</span><span>'+(s==='know'?'Marked: I know this':s==='need'?'Marked: Need more practice':'Not marked yet')+'</span></div>'+
 '<div class="tags"><span class="chip sub" style="--c:'+SUBJECTS[cd.subject].color+'">'+esc(SUBJECTS[cd.subject].short)+'</span><span class="chip">'+esc(cd.topic)+'</span></div>'+
 '<div class="fcard'+(ui.flip?' back':'')+(ui.anim?' anim':'')+'" data-act="flip" tabindex="0" role="button" aria-label="Flip card"><span class="fc-tag">'+(ui.flip?'ANSWER':'CLUE — try to recall the answer first')+'</span><div class="fc-main">'+esc(ui.flip?cd.back.split('\n\n')[0]:cd.front)+'</div>'+(ui.flip&&cd.back.indexOf('\n\n')>-1?'<div class="fc-note">'+esc(cd.back.split('\n\n').slice(1).join('\n\n'))+'</div>':'')+'</div>'+
 '<div class="row sp"><button class="btn" data-act="cprev"'+(ui.i===0?' disabled':'')+'>← Previous</button><button class="btn" data-act="flip">Flip card</button><button class="btn" data-act="cnext">Next →</button></div>'+
 '<div class="row"><button class="btn" data-act="mark" data-m="need">Need more practice</button><button class="btn pri" data-act="mark" data-m="know">I know this</button><button class="btn" data-act="cshuffle">Shuffle</button></div><p class="note">Keyboard: Space = flip, ← → = previous / next.</p>';
}
function deckEnd(){
 let k=0,n=0,u=0;ui.cards.forEach(cd=>{const s=store.cards[cd.id];if(s==='know')k++;else if(s==='need')n++;else u++;});
 return '<h1>Deck complete</h1><div class="card"><div class="grid g4"><div class="tile"><b style="color:var(--ok)">'+k+'</b><span>I know this</span></div><div class="tile"><b style="color:var(--warn)">'+n+'</b><span>Need more practice</span></div><div class="tile"><b>'+u+'</b><span>Not marked</span></div></div><div class="row"><button class="btn pri" data-act="restartdeck">Go through again</button><button class="btn" data-act="nav" data-v="cards">Change filters</button><button class="btn" data-act="nav" data-v="home">Dashboard</button></div></div>';
}

/* =====================================================================
   11. REVIEW MY MISTAKES
   ===================================================================== */
function vMistakes(){
 const f=ui.mf||'all',all=mistakeIds().map(id=>QMAP[id]),list=all.filter(q=>f==='all'||q.subject===f);
 const opts=Object.keys(SUBJECTS).map(k=>'<option value="'+k+'"'+(f===k?' selected':'')+'>'+esc(SUBJECTS[k].short)+' ('+all.filter(q=>q.subject===k).length+')</option>').join('');
 let h='<h1>Review my mistakes</h1><p class="lead">Every question you answer incorrectly is saved here. Answer it correctly <b>2 times in a row</b> and it is removed automatically.</p>';
 h+='<div class="grid g4" style="margin-bottom:18px"><div class="tile"><b>'+all.length+'</b><span>Still to master</span></div><div class="tile"><b style="color:var(--ok)">'+(store.cleared||0)+'</b><span>Cleared so far</span></div></div>';
 if(!all.length)return h+'<div class="card"><h2>No mistakes saved</h2><p>Nothing to review right now. Answer questions in Study mode or take a mock exam, and any wrong answers will show up here.</p><div class="row"><button class="btn pri" data-act="nav" data-v="study">Go to Study mode</button></div></div>';
 h+='<div class="row sp" style="margin:0 0 14px"><label class="row" style="margin:0"><span class="note" style="margin:0">Subject</span><select id="m-subj" data-ch="msubj" style="width:auto"><option value="all">All subjects ('+all.length+')</option>'+opts+'</select></label><button class="btn pri" data-act="practicemist"'+(list.length?'':' disabled')+'>Practice '+list.length+' question'+(list.length===1?'':'s')+'</button></div>';
 h+=list.map(q=>{
  const m=store.mistakes[q.id],st=store.q[q.id]||{r:0,w:0};
  return '<details class="mi"><summary>'+esc(q.question)+'</summary><div class="in">'+tagsHTML(q,true)+'<p><b>Correct answer:</b> '+esc(correctText(q))+'</p><div class="expl">'+esc(q.explanation)+'</div><p class="note">Improvement: '+m.ok+' of 2 correct in a row · lifetime '+st.r+' right / '+st.w+' wrong</p>'+bar(m.ok/2*100)+'<div class="row"><button class="btn sm" data-act="removemist" data-id="'+q.id+'">Remove from list (I understand this)</button></div></div></details>';
 }).join('');
 return h;
}

/* =====================================================================
   12. SOURCE NOTES
   ===================================================================== */
function vNotes(){
 const issues=validate();
 const rows=Object.keys(SUBJECTS).map(k=>{const qs=QUESTIONS.filter(q=>q.subject===k),by=t=>qs.filter(q=>q.type===t).length,dd=d=>qs.filter(q=>q.difficulty===d).length;return '<tr><td>'+esc(SUBJECTS[k].short)+'</td><td>'+qs.length+'</td><td>'+by('mcq')+'</td><td>'+by('tf')+'</td><td>'+by('id')+'</td><td>'+by('sit')+'</td><td>'+dd('easy')+' / '+dd('medium')+' / '+dd('hard')+'</td><td>'+CARDS.filter(cd=>cd.subject===k).length+'</td></tr>';}).join('');
 return '<h1>Source notes</h1><p class="lead">How the questions were built from your reviewer, and what to double-check.</p>'+
 '<div class="card"><h2>Items in the reviewer to double-check</h2><p>These parts looked unclear, garbled, or questionable, so they were flagged instead of silently changed.</p>'+NOTES.map(n=>'<div class="rec warn"><b>'+esc(n[0])+'</b><br>'+esc(n[1])+'</div>').join('')+'</div>'+
 '<div class="card"><h2>Question bank coverage</h2><div class="scroll"><table><thead><tr><th>Subject</th><th>Total</th><th>MC</th><th>T/F</th><th>ID</th><th>Situational</th><th>Easy / Med / Hard</th><th>Cards</th></tr></thead><tbody>'+rows+'<tr><td><b>All</b></td><td><b>'+QUESTIONS.length+'</b></td><td colspan="5"></td><td><b>'+CARDS.length+'</b></td></tr></tbody></table></div>'+
 '<p class="note">The Fast Exam Recall Matrix items were folded into their subjects as high-priority questions. Questions marked ★ Exam Focus in your reviewer are noted in the explanations.</p>'+
 (issues.length?'<div class="rec warn"><b>Bank check found problems:</b><br>'+issues.map(esc).join('<br>')+'</div>':'<div class="rec good">Bank check passed: no duplicates, no empty fields, every multiple-choice question has 4 distinct choices and exactly one correct answer.</div>')+'</div>'+
 '<div class="card"><h2>Adding your own questions</h2><p>Open this file in a text editor and add lines at the <b>end</b> of the question bank, for example:</p><pre>mc("digital", T.dis, "easy", "Your question?", "Correct answer", ["Wrong 1","Wrong 2","Wrong 3"], "Why it is correct.");\ntf("material", T.mat, "easy", "A statement.", true, "Explanation.");\nidq("spiritual", T.logo, "easy", "A clue.", "Answer", ["alternate spelling"], "Explanation.");</pre><p class="note">For multiple choice, write the correct answer first. The app shuffles the choices for you.</p></div>';
}

/* =====================================================================
   13. ACTIONS & EVENTS
   ===================================================================== */
const actions={
 nav(t){go(t.dataset.v);},
 theme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';store.theme=t;save();setTheme(t);},
 reset(){ask('Reset all progress?','This will delete your saved scores, mistakes, flashcard marks, exam history, and any exam in progress. This cannot be undone.','Yes, reset everything',()=>{const th=store.theme;try{localStorage.removeItem(KEY);}catch(e){}store=blank();store.theme=th;save();go('home');},true);},
 pick(t){const v=parseVal(t.dataset.v);if(view==='study')studyAnswer(v);else if(view==='exam'&&store.active)examAnswer(v);},
 idsubmit(){const el=$('#idin');if(el)studyAnswer(el.value);},
 reveal(){ui.revealed=true;render();},
 next(){if(!ui.answered)return;if(ui.i+1>=ui.list.length)ui.stage='done';else{ui.i++;prepQ();}render();window.scrollTo(0,0);},
 override(){const q=ui.list[ui.i];if(!ui.answered||ui.last.ok)return;restore(q.id,ui.snap);const r=record(q,true);ui.last={ok:true,cleared:r.cleared,overridden:true};ui.correct++;ui.wrongs=ui.wrongs.filter(x=>x!==q);if(r.cleared)ui.cleared++;render();},
 quitstudy(){ask('End this session?','Your answers so far are already saved.','End session',()=>{ui.stage='done';ui.list=ui.list.slice(0,ui.i+(ui.answered?1:0))||ui.list;if(!ui.list.length){go(ui.src==='mistakes'?'mistakes':'study');}else render();});},
 startstudy(){const list0=filteredQs();if(!list0.length)return;const len=$('#f-len').value;store.recall=$('#f-recall').checked;save();let list=$('#f-pri').checked?weightedOrder(list0,qWeight):shuffle(list0);if(len!=='all')list=list.slice(0,+len);startStudy(list,'study');},
 startexam(){
  const subs=[...document.querySelectorAll('.ex-s:checked')].map(e=>e.value);const pool=QUESTIONS.filter(q=>subs.includes(q.subject));if(!pool.length)return;
  const cc=$('#x-n').value,n=cc==='all'?pool.length:Math.min(+cc,pool.length),picked=shuffle(pool).slice(0,n);
  store.active={id:Date.now(),elapsed:0,limit:(+$('#x-t').value)*60,idx:0,subjects:subs,items:picked.map(q=>({id:q.id,ord:q.options?shuffle(q.options.map((_,i)=>i)):[],ans:null}))};
  save();ui={stage:'run'};render();window.scrollTo(0,0);
 },
 resume(){go('exam');ui={stage:'run'};render();window.scrollTo(0,0);},
 discard(){ask('Discard this exam?','Your answers in the unfinished exam will be lost.','Discard',()=>{store.active=null;save();go('exam');},true);},
 prev(){const A=store.active;if(A.idx>0){A.idx--;save();render();window.scrollTo(0,0);}},
 nextq(){const A=store.active;if(A.idx<A.items.length-1){A.idx++;save();render();window.scrollTo(0,0);}},
 jump(t){const A=store.active;A.idx=+t.dataset.i;save();render();window.scrollTo(0,0);},
 clear(){const A=store.active;A.items[A.idx].ans=null;save();render();},
 submit(){const A=store.active,un=A.items.filter(isBlank).length;
  ask(un?'Submit incomplete exam?':'Submit exam?',un?'You still have <b>'+un+'</b> unanswered question'+(un>1?'s':'')+'. Unanswered questions count as not correct. Submit anyway?':'Once you submit, your answers are final and your score will be shown.','Submit exam',()=>finishExam(false));},
 viewexam(t){const rec=store.exams.find(e=>String(e.id)===t.dataset.id);if(!rec)return;go('exam');ui={stage:'result',exam:rec,rf:'all'};render();window.scrollTo(0,0);},
 rfilter(t){ui.rf=t.dataset.f;render();},
 practicemist(){
  const f=view==='mistakes'?(ui.mf||'all'):'all';
  const list=mistakeIds().map(id=>QMAP[id]).filter(q=>f==='all'||q.subject===f);if(!list.length)return;
  const ordered=weightedOrder(list,qWeight);go('study');startStudy(ordered,'mistakes');
 },
 removemist(t){delete store.mistakes[t.dataset.id];save();render();},
 startcards(){const d=buildDeck();if(!d.list.length){alert('No cards match these filters yet. Mark some cards as “Need more practice” first, or change the filters.');return;}ui={stage:'deck',cards:orderDeck(d.list,d.pri),pri:d.pri,all:d.list,i:0,flip:false};render();window.scrollTo(0,0);},
 flip(){ui.flip=!ui.flip;ui.anim=true;render();ui.anim=false;},
 cnext(){if(ui.i<ui.cards.length-1){ui.i++;ui.flip=false;render();}else{ui.stage='end';render();}},
 cprev(){if(ui.i>0){ui.i--;ui.flip=false;render();}},
 mark(t){store.cards[ui.cards[ui.i].id]=t.dataset.m;save();actions.cnext();},
 cshuffle(){ui.cards=orderDeck(ui.all,ui.pri);ui.i=0;ui.flip=false;render();},
 restartdeck(){ui.cards=orderDeck(ui.all,ui.pri);ui.i=0;ui.flip=false;ui.stage='deck';render();}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const fn=actions[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('change',e=>{
 const k=e.target.dataset&&e.target.dataset.ch;if(!k)return;
 if(k==='filt')updateFilter(e.target);
 else if(k==='exset')updateExamSetup();
 else if(k==='msubj'){ui.mf=e.target.value;render();}
});
document.addEventListener('input',e=>{if(e.target.id==='idin'&&view==='exam'&&ui.stage==='run')liveTyping(e.target);});
document.addEventListener('keydown',e=>{
 const ov=document.querySelector('.overlay');
 if(ov){if(e.key==='Escape')ov.remove();return;}
 const ae=document.activeElement,tag=ae?ae.tagName:'',typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
 if(view==='study'&&ui.stage==='q'){
  if(e.key==='Enter'&&tag!=='BUTTON'){
   if(ui.answered){e.preventDefault();actions.next();}
   else if(ae&&ae.id==='idin'){e.preventDefault();actions.idsubmit();}
   return;
  }
 }
 if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();
 const optKey=()=>{const q=view==='study'?ui.list&&ui.list[ui.i]:store.active&&QMAP[store.active.items[store.active.idx].id];if(!q||q.type==='id')return;
  const btns=document.querySelectorAll('.opt:not(:disabled)');let idx=-1;
  if(q.type==='tf'){if(k==='t')idx=0;else if(k==='f')idx=1;}else{idx='abcd'.indexOf(k);if(idx<0)idx='1234'.indexOf(k);}
  if(idx>=0&&btns[idx]){e.preventDefault();btns[idx].click();}};
 if(view==='study'&&ui.stage==='q'&&!ui.answered)optKey();
 else if(view==='exam'&&ui.stage==='run'&&store.active){
  if(e.key==='ArrowRight'){actions.nextq();}else if(e.key==='ArrowLeft'){actions.prev();}else optKey();
 }else if(view==='cards'&&ui.stage==='deck'){
  if(e.key===' '||e.key==='Spacebar'){e.preventDefault();actions.flip();}
  else if(e.key==='ArrowRight')actions.cnext();else if(e.key==='ArrowLeft')actions.cprev();
 }
});
window.addEventListener('beforeunload',()=>{if(store.active)save();});

/* =====================================================================
   14. START
   ===================================================================== */
const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(store.theme||(prefersDark?'dark':'light'));
render();
window.__UTS={QUESTIONS,CARDS,validate,store:()=>store,actions,go,norm,checkId};
})();
</script>
</body>
